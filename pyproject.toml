[project]
name = "ai-data-analyst"
version = "1.0.0"
description = "AI Data Analyst & Business Intelligence Agent for e-commerce data"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: calls the real Anthropic API (requires ANTHROPIC_API_KEY); run with -m live"]
filterwarnings = ["ignore::DeprecationWarning:httpx2.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
